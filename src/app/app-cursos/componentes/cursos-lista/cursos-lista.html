<h1>Cursos Store</h1>

<div class="container">
  <div class="column left-column">
    <table>
        <tbody>
            @for(curso of cursosTomar$ | async; track curso.id) {
                <tr>
                    <td>
                        <input type="checkbox" (change)="completarCurso(curso.id)" />
                        {{ curso.nombre }}
                    </td>
                    <td>
                        <button (click)="borrarCurso(curso.id)" class="boton boton2">🗑️</button>
                    </td>
                </tr>
            }
        </tbody>
        <tfoot>
            <tr>
                <td>Cursos pendientes:</td>
                <td>{{ totalCursosTomar$ | async }}</td>
            </tr>
            <tr>
                <td>Curso completados:</td>
                <td>{{ totalCursosCompletados$ | async }}</td>
            </tr>
        </tfoot>
    </table>
  </div>

  <div class="column right-column">
    <fieldset>
        <legend>Curso</legend>

        <form [formGroup]="formaCurso" (ngSubmit)="enviar()">
            <div>
                <input type="text" placeholder="Nombre" formControlName="nombre" />
            </div>
            <div>
                <input type="text" placeholder="Categoría" formControlName="categoria" />
            </div>
            <div>
                <input type="number" placeholder="Duración" formControlName="duracion" />
            </div>
            <div>
                <input type="text" placeholder="Descripción" formControlName="descripcion" />
            </div>
            <div>
                <input type="text"   placeholder="Imagen"      formControlName="imagen" />
            </div>
            <div>
                <input type="checkbox" id="completado" formControlName="completado" />
                <label for="completado">Completado</label>
            </div>
            <button>Agregar curso</button>
        </form>
    </fieldset>
  </div>
</div>
